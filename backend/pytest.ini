# pytest 配置（P0）
#
# 说明：
#   - testpaths 固定到 tests/，避免 pytest 顺手收集到 .venv 里的第三方测试；
#   - 默认只跑单元测试；集成测试靠 `-m integration` 显式选择，
#     因为它们需要本地 MySQL/Redis（见 tests/conftest.py 的夹具设计）。
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    integration: 需要本地 MySQL 与 Redis 的集成测试（默认仍会运行，用 -m "not integration" 排除）
filterwarnings =
    ignore::DeprecationWarning

