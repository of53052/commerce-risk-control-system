# Alembic configuration (P0) -- e-commerce risk control system
#
# NOTE (important): KEEP THIS FILE ASCII-ONLY.
#   On Windows, Alembic reads this file through Python's configparser, which
#   opens it with the *locale* codec (cp936/GBK on zh-CN). Any non-ASCII byte
#   here makes every `alembic` command crash with UnicodeDecodeError.
#   All Chinese design notes therefore live in backend/alembic/env.py,
#   docs/ARCHITECTURE.md section 13 and docs/PRD.md appendices A/B.
#
# NOTE: no sqlalchemy.url on purpose. The URL comes from
#   app.core.config.settings (backend/.env, gitignored) inside alembic/env.py,
#   so the migration tool and the FastAPI app always target the same database,
#   and the DB password never enters version control.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filename: yyyymmdd_hhmm_<rev>_<slug>.py -- sorts chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
